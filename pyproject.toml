[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-publisher"
version = "1.0.0"
description = "Production-grade Telegram Publishing Platform"
requires-python = ">=3.11"

dependencies = [
    # Telegram
    "aiogram==3.13.1",
    "aiohttp>=3.10.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",   # dev/lightweight mode

    # Queue & Cache
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.1.1",
    "kombu>=5.4.0",

    # Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",

    # Scheduling
    "APScheduler>=3.10.4",
    "celery-beat>=0.0.1",

    # HTTP client
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # Content processing
    "feedparser>=6.0.11",
    "bleach>=6.1.0",
    "Pillow>=11.0.0",
    "imagehash>=4.3.1",

    # Templates
    "jinja2>=3.1.4",

    # Language detection
    "langdetect>=1.0.9",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pytz>=2024.2",
    "shortuuid>=1.0.13",
    "humanize>=4.11.0",
    "xxhash>=3.5.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.52.0",
    "anthropic>=0.36.0",
]
monitoring = [
    "prometheus-client>=0.21.0",
    "sentry-sdk>=2.17.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
